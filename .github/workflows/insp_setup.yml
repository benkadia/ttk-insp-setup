name: TTK Inspection Setup
on:
  schedule:
    - cron: '0 2 * * *'    # 09:00 giờ VN (UTC+7)
    - cron: '0 7 * * *'    # 14:00 giờ VN
  workflow_dispatch:        # nút chạy tay
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Chạy script
        shell: powershell
        env:
          SAP_USER: ${{ secrets.SAP_USER }}
          SAP_PASS: ${{ secrets.SAP_PASS }}
        run: .\Tao_InspSetup.ps1 -ThucHien -SuaDM1 -DonDep
      - name: Lưu log (chỉ khi có việc)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: Log_TaoInspSetup_*.xlsx
          if-no-files-found: ignore
          retention-days: 90
